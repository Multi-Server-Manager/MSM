[workspace]
resolver = "2"
members = ["crates/msm-protocol", "crates/msm-client"]

[workspace.package]
version = "1.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/MSM/MSM"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
hmac = "0.12"
rand = "0.8"
ratatui = "0.25"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
russh = { version = "0.64", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps payload members in their declared order, so this crate
# writes the same bytes as the Go node for the same result.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
vt100 = "0.18"
x25519-dalek = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
